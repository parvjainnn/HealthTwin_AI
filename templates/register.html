{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <span style="font-size:2.5rem;">🧬</span>
            <div class="auth-brand">HealthTwin</div>
            <div class="auth-tagline" data-i18n="auth.tagline">Your Digital Health Twin</div>
        </div>

        <h1 class="auth-title" data-i18n="register.title">Create Account</h1>
        <p class="auth-subtitle" data-i18n="register.subtitle">Start tracking your health journey</p>

        <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
            <div class="form-group">
                <label for="username" data-i18n="form.username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" data-i18n-placeholder="placeholder.choose_username" required minlength="3" autofocus>
            </div>
            <div class="form-group">
                <label for="email" data-i18n="form.email">Email</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" data-i18n-placeholder="placeholder.email" required>
            </div>
            <div class="form-group">
                <label for="password" data-i18n="form.password">Password</label>
                <div class="password-wrap">
                    <input type="password" id="password" name="password" placeholder="Min. 6 characters" data-i18n-placeholder="placeholder.password_min" required minlength="6">
                    <button type="button" class="toggle-pw" onclick="togglePw('password', this)">👁</button>
                </div>
            </div>
            <div class="form-group">
                <label for="confirm_password" data-i18n="register.confirm_password">Confirm Password</label>
                <div class="password-wrap">
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat password" data-i18n-placeholder="placeholder.repeat_password" required>
                    <button type="button" class="toggle-pw" onclick="togglePw('confirm_password', this)">👁</button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-full" data-i18n="register.submit">Create Account →</button>
        </form>

        <p class="auth-switch">
            <span data-i18n="register.switch_prefix">Already have an account?</span> <a href="{{ url_for('auth.login') }}" data-i18n="register.switch_link">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function togglePw(id, btn) {
    const inp = document.getElementById(id);
    if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
    else { inp.type = 'password'; btn.textContent = '👁'; }
}
</script>
{% endblock %}
