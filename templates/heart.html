{% extends "base.html" %}
{% block title %}Heart Disease{% endblock %}

{% block content %}
<div class="container">
    <div class="section-header-block">
        <h1>❤️ Heart Disease Detection</h1>
        <p>Provide your cardiovascular metrics for analysis</p>
    </div>
    <div class="prediction-form-container">
        <div class="form-card">
            <form id="heartForm" onsubmit="return handlePredict(event, 'heart')">
                <div class="form-grid">
                    <div class="form-group"><label>🎂 Age</label><input type="number" name="age" placeholder="e.g. 55" required></div>
                    <div class="form-group"><label>👤 Sex</label>
                        <select name="sex" required><option value="">Select...</option><option value="1">Male</option><option value="0">Female</option></select></div>
                    <div class="form-group"><label>💔 Chest Pain Type</label>
                        <select name="chest_pain_type" required><option value="">Select...</option>
                            <option value="0">Typical Angina</option><option value="1">Atypical Angina</option>
                            <option value="2">Non-Anginal</option><option value="3">Asymptomatic</option></select></div>
                    <div class="form-group"><label>💉 Resting BP</label><input type="number" name="resting_bp" placeholder="e.g. 140" step="0.1" required></div>
                    <div class="form-group"><label>🧪 Cholesterol</label><input type="number" name="cholesterol" placeholder="e.g. 289" step="0.1" required></div>
                    <div class="form-group"><label>🍬 Fasting BS >120</label>
                        <select name="fasting_bs" required><option value="">Select...</option><option value="1">Yes</option><option value="0">No</option></select></div>
                    <div class="form-group"><label>📊 Resting ECG</label>
                        <select name="resting_ecg" required><option value="">Select...</option>
                            <option value="0">Normal</option><option value="1">ST-T Abnormality</option><option value="2">LV Hypertrophy</option></select></div>
                    <div class="form-group"><label>💓 Max Heart Rate</label><input type="number" name="max_hr" placeholder="e.g. 172" step="0.1" required></div>
                    <div class="form-group"><label>🏃 Exercise Angina</label>
                        <select name="exercise_angina" required><option value="">Select...</option><option value="1">Yes</option><option value="0">No</option></select></div>
                    <div class="form-group"><label>📉 Oldpeak (ST Depression)</label><input type="number" name="oldpeak" placeholder="e.g. 0" step="0.1" required></div>
                </div>
                <button type="submit" class="btn btn-primary btn-submit">🔍 Detect Heart Disease</button>
            </form>
            <div class="result-container" id="result-heart"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}<script src="{{ url_for('static', filename='js/predict.js') }}"></script>{% endblock %}
