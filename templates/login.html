{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <span style="font-size:2.5rem;">🧬</span>
            <div class="auth-brand">HealthTwin</div>
            <div class="auth-tagline" data-i18n="auth.tagline">Your Digital Health Twin</div>
        </div>

        <h1 class="auth-title" data-i18n="login.title">Welcome Back</h1>
        <p class="auth-subtitle" data-i18n="login.subtitle">Sign in to access your health dashboard</p>

        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
            <div class="form-group">
                <label for="username" data-i18n="form.username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" data-i18n-placeholder="placeholder.username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password" data-i18n="form.password">Password</label>
                <div class="password-wrap">
                    <input type="password" id="password" name="password" placeholder="Enter your password" data-i18n-placeholder="placeholder.password" required>
                    <button type="button" class="toggle-pw" onclick="togglePw('password', this)">👁</button>
                </div>
            </div>
            <div class="form-check">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember" data-i18n="login.remember">Remember me</label>
            </div>
            <button type="submit" class="btn btn-primary btn-full" data-i18n="login.submit">Sign In →</button>
        </form>

        <p class="auth-switch">
            <span data-i18n="login.switch_prefix">Don't have an account?</span> <a href="{{ url_for('auth.register') }}" data-i18n="login.switch_link">Create one</a>
        </p>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function togglePw(id, btn) {
    const inp = document.getElementById(id);
    if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
    else { inp.type = 'password'; btn.textContent = '👁'; }
}
</script>
{% endblock %}
